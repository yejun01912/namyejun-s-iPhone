function updateClock(){const d=new Date();$('statusTime').textContent=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});$('clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});$('date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});}updateClock();setInterval(updateClock,15000);

function pressKey(n){if(typed.length>=4)return;typed+=n;drawDots();if(typed.length===4){setTimeout(()=>{if(typed===PIN){unlocked=true;$('lock').classList.add('hidden');$('home').classList.remove('hidden');/* message schedule starts when page opens */}else{$('hint').textContent='암호가 올바르지 않습니다';$('dots').classList.add('shake');setTimeout(()=>{$('dots').classList.remove('shake');$('hint').textContent='';typed='';drawDots();},450);}},170);}}

function escapeNote(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showNotesList(){
 $('back').classList.add('hidden');
 $('content').innerHTML=`<div class="notes-view"><div class="notes-nav"><button type="button" id="notesHome">‹ 홈</button><span>•••</span></div><h1 class="notes-heading">메모</h1><div class="notes-search">⌕ 검색</div><h2 class="notes-group-label">메모</h2><div class="notes-list">${noteEntries.map((n,i)=>`<div class="notes-row" data-note="${i}" role="button" tabindex="0"><div class="notes-row-title">${escapeNote(n.title)}</div><div class="notes-row-preview"><span class="notes-row-date">${escapeNote(n.date)}</span>${escapeNote((n.body|| (n.image?'첨부 이미지':(n.checklist||[]).join(' · '))).replace(/\n/g,' ').slice(0,70))}</div></div>`).join('')}</div><div class="notes-toolbar"><span>☷</span><span>${noteEntries.length}개의 메모</span><span>▣</span></div></div>`;
 $('notesHome').onclick=showHome;
 $('content').querySelectorAll('[data-note]').forEach(el=>{const open=()=>showNoteDetail(Number(el.dataset.note));el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});
}
function getCheck(i,j){try{return localStorage.getItem('note-check-'+i+':'+j)==='1'}catch(e){return !!window.noteChecks?.[i+':'+j]}}
function showNoteDetail(i){
 const n=noteEntries[i];if(!n)return;
 $('content').innerHTML=`<div class="notes-view notes-detail"><div class="notes-nav"><button type="button" id="notesListBack">‹ 메모</button><span>•••</span></div><time>${escapeNote(n.date)}</time><h2>${escapeNote(n.title)}</h2><div class="notes-body">${n.image?`<img src="${n.image}" style="width:100%;border-radius:10px">`:n.checklist?n.checklist.map((t,j)=>`<label class="note-check-row"><input type="checkbox" data-check="${i}:${j}" ${getCheck(i,j)?'checked':''}><span>${escapeNote(t)}</span></label>`).join(''):escapeNote(n.body||'')}</div></div><div class="notes-toolbar"><span>☑</span><span>↗　▣</span></div>`;
 $('notesListBack').onclick=showNotesList;document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{window.noteChecks=window.noteChecks||{};window.noteChecks[el.dataset.check]=el.checked;try{localStorage.setItem('note-check-'+el.dataset.check,el.checked?'1':'0')}catch(e){}});
}
function openApp(id){
 $('back').classList.remove('hidden');$('home').classList.add('hidden');$('appscreen').classList.remove('hidden');let html='';
if(id==='notes'){showNotesList();return;}
if(id==='photos'){showPhotoAlbum();return;}
if(id==='instagram'){showInstagram();return;}
if(id==='messages'){showMessages();return;}
if(id==='music'){showMusic();return;}
if(id==='voice'){showVoiceMemos();return;}
if(id==='rummikub'){showHome();return;}
$('content').innerHTML=html;
}
const sms=[];
function showMessages(){appView(`<div class="ios-msg"><header><button onclick="showHome()">‹ 홈</button><b>메시지</b></header>${sms.length?`<div class="sms-row" onclick="showSmsThread()"><div class="sms-avatar">💐💙</div><div><b>💐💙</b><p>${ehtml(sms[sms.length-1])}</p></div></div>`:'<p class="sms-empty">메시지가 없습니다.</p>'}</div>`)}

function ico(name,size=25){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${uiIcons[name]||''}</svg>`}
function igNav(active='profile'){return `<nav class="ig-bottom"><button onclick="showInstagram()" aria-label="홈">${ico('home')}</button><button onclick="showInstagram()" aria-label="검색">${ico('search')}</button><button onclick="showInstagram()" aria-label="릴스">${ico('reels')}</button><button onclick="showInbox()" aria-label="메시지">${ico('send')}</button><button onclick="showInstagram()" aria-label="프로필" class="ig-nav-avatar">${avatarSVG}</button></nav>`}
function igShell(body){appView(`<div class="ig ig-layout">${body}${igNav()}</div>`)}
function showInstagram(){igShell(`<div class="ig-scroll"><div class="ighead"><button onclick="showHome()" aria-label="홈으로">${ico('back',22)}</button><span>namyejun</span><button aria-label="메뉴">${ico('menu',23)}</button></div><div class="igstats"><div class="igavatar">${avatarSVG}</div><div class="igcounts"><div><b>7</b>게시물</div><div><b>912</b>팔로워</div><div><b>312</b>팔로잉</div></div></div><div class="igbio">남예준</div><div class="igprofile-actions"><button>프로필 편집</button><button>프로필 공유</button></div><div class="ig-tabs">${ico('grid',21)}</div><div class="iggrid">${postData.map((p,i)=>`<button onclick="showPost(${i})" aria-label="${i+1}번 게시물"><img src="${photoPath(p.imgs[0])}" alt="게시물 ${i+1}"></button>`).join('')}</div></div>`)}
let currentPost=0,currentSlide=0;
function showPost(i,slide=0){currentPost=i;currentSlide=slide;let p=postData[i];igShell(`<div class="ig-scroll ig-postscroll"><div class="ighead igpost-header"><button onclick="showInstagram()" aria-label="뒤로">${ico('back',22)}</button><span>게시물</span><span></span></div><article class="igpost"><div class="posttop"><span class="ig-mini">${avatarSVG}</span><b>namyejun</b><span class="ig-more">···</span></div><div class="post-media"><img id="slideimg" src="${photoPath(p.imgs[slide])}" alt="게시물 사진 ${slide+1}" draggable="false">${p.imgs.length>1?`<button class="slide-prev" onclick="changeSlide(-1)" aria-label="이전 사진">‹</button><button class="slide-next" onclick="changeSlide(1)" aria-label="다음 사진">›</button><div class="slide-counter">${slide+1}/${p.imgs.length}</div>`:''}</div><div class="post-actions"><button aria-label="좋아요" onclick="this.classList.toggle('liked')">${ico('heart')}</button><button aria-label="댓글">${ico('comment')}</button><button aria-label="공유">${ico('send')}</button><button class="post-save" aria-label="저장">${ico('save')}</button></div><div class="iglikes">여러명이 좋아합니다</div><div class="caption"><b>namyejun</b> ${ehtml(p.caption)}</div></article></div>`)}
function changeSlide(dir){let p=postData[currentPost];showPost(currentPost,(currentSlide+dir+p.imgs.length)%p.imgs.length)}
const inbox=[['사랑해🫧','보고싶당 ㅎㅎ',true],['한노아','ㅇㅋ 이따봐',false],['도은호','형 믿고 지금 끓일게요 진짜로 떨린다',false],['채밤비','아 형!!!!',false],['유하민','바다 갈래요?',false]];

const chatData=[
['me','머해 ~.~'],['them','ㅋㅋ'],['them','예준이 생각~'],['me','그거 알아?'],['me','자기가 내 생각 해주면은 나는 힘이 난다는 사 실 !'],['me','오 나 지금 갑자기 힘나는데?'],['them','뭐야~ ㅋㅋㅋㅋㅋ'],['them','밥은? 먹었어?'],['me','나는 국밥 먹는중'],['me','든든하게 먹어'],['me','지금은 밥 먹고 커피 마시는 중!'],
['me','룸큡?'],['them','ㄱㄱ'],['me','010912'],['me','들어와'],['me','이제 눈뜨고한다 ㅋㅋ'],['me','첫 판 봐줬고'],['me','잉'],['me','나 잘래...'],['them','실력 키우고 와라 두두야 ㅋㅋㅋㅋ'],['me','잘자... 사랑해...'],
['me','와 어제 완전 기절했네 진짜 푹 잤다'],['me','나 근데 일어나자마자 배고파 이거 정상이야?'],['them','두두 밥 안먹고 출근했어?ㅠㅠ'],['me','회사가서 먹을려구 ㅎㅎ 자기두 밥 챙겨먹어~.~'],
['me','있잖아 자기야'],['them','웅?'],['me','__image__'],['me','ㅎㅎ'],['me','보고싶당 ㅎㅎ']];
const extraChatKey='iphone_story_chat_extra_v1';
function readExtraChat(){try{const x=JSON.parse(localStorage.getItem(extraChatKey)||'[]');return Array.isArray(x)?x.slice(-300).map(v=>typeof v==='string'?{side:'me',text:v}:v).filter(v=>v&&['me','them'].includes(v.side)&&typeof v.text==='string'):[]}catch{return []}}
function saveExtraChat(a){try{localStorage.setItem(extraChatKey,JSON.stringify(a.slice(-300)))}catch{}}
function replyFor(message){const rules=[['사랑해','나도 사랑해💙'],['바보','나 바보아닌데??????'],['두두 핸드폰 내가 가져간다','오이잉?!?😳 자기야 내 폰!'],['자기야','왜불러 자기야아?.?'],['뭐 해?','자기 생각하지 ㅎㅎ']];return (rules.find(([key])=>message.includes(key))||[null,'사랑해💙'])[1]}
function appendChatBubble(side,text){const log=document.getElementById('chatlog');if(!log)return;const bubble=document.createElement('div');bubble.className='bubble '+side;bubble.textContent=text;log.appendChild(bubble);log.scrollTop=log.scrollHeight}
function sendChatMessage(ev){ev.preventDefault();const input=document.getElementById('chat-message-input');if(!input)return;const message=input.value.trim();if(!message)return;const msgs=readExtraChat();msgs.push({side:'me',text:message.slice(0,1000)});saveExtraChat(msgs);appendChatBubble('me',message);inbox[0][1]=message;input.value='';input.focus();const delay=2000+Math.floor(Math.random()*3001);const log=document.getElementById('chatlog');if(log){const typing=document.createElement('div');typing.className='bubble them typing-indicator';typing.textContent='입력 중...';log.appendChild(typing);log.scrollTop=log.scrollHeight;}setTimeout(()=>{document.querySelector('.typing-indicator')?.remove();const answer=replyFor(message);const all=readExtraChat();all.push({side:'them',text:answer});saveExtraChat(all);inbox[0][1]=answer;appendChatBubble('them',answer);},delay)}
function showChat(){igShell(`<div class="dm-chat"><div class="dmbar"><button onclick="showInbox()" aria-label="뒤로">${ico('back',22)}</button><div class="dmface dmface-small">💙</div><div class="chat-title"><b>사랑해🫧</b><small>Instagram</small></div></div><div class="chat" id="chatlog">${chatData.map(([side,msg],i)=>`${[11,21,25].includes(i)?'<div class="chat-day-separator"><span>다른 날</span></div>':''}<div class="bubble ${side}">${msg==='__image__'?'<img src="assets/chat-photo.jpg" alt="첨부 사진">':ehtml(msg)}</div>`).join('')}${readExtraChat().map(v=>`<div class="bubble ${v.side}">${ehtml(v.text)}</div>`).join('')}</div><form class="chat-compose chat-compose-live" onsubmit="sendChatMessage(event)"><input id="chat-message-input" type="text" maxlength="1000" autocomplete="off" aria-label="메시지 입력" placeholder="메시지 보내기..."/><button type="submit" aria-label="메시지 보내기">보내기</button></form></div>`);let c=$('chatlog');c.scrollTop=c.scrollHeight;}
let callCount=0,ringTimer=null,notificationTimer=null;
function banner(message,missed=false){if(!missed)playAlertTone();document.querySelector('.banner')?.remove();const b=document.createElement('div');b.className='banner banner-animated';b.innerHTML=`<small>💐💙 · ${missed?'부재중 전화':'메시지'} · 지금</small><b>${ehtml(message)}</b>`;document.querySelector('.phone').appendChild(b);clearTimeout(notificationTimer);notificationTimer=setTimeout(()=>b.remove(),7000);}
function incomingCall(){callCount++;startRingtone();document.querySelector('.banner')?.remove();document.querySelector('.call')?.remove();let v=document.createElement('div');v.className='call';v.innerHTML=`<div><div class="callname">💐💙</div><div class="callsub" id="callstatus">수신 전화...</div></div><div class="callbuttons"><button class="reject" onclick="endCall(false)">✕</button><button class="accept" onclick="answerCall()">☎</button></div>`;document.querySelector('.phone').appendChild(v);ringTimer=setTimeout(()=>endCall(false),25000);}
function answerCall(){stopRingtone();clearTimeout(ringTimer);document.querySelector('#callstatus').textContent='통화 중';document.querySelector('.callbuttons').innerHTML='<button class="reject" onclick="endCall(true)">✕</button>';callAudio.currentTime=0;callAudio.play().catch(()=>{document.querySelector('#callstatus').textContent='소리를 재생할 수 없어요. GitHub 파일을 확인해 주세요.'});callAudio.onended=()=>endCall(true);}
function endCall(answered){stopRingtone();clearTimeout(ringTimer);callAudio.pause();callAudio.currentTime=0;document.querySelector('.call')?.remove();if(!answered&&callCount===1){banner('부재중 전화',true);setTimeout(()=>{smsAdd('잉?ㅠ 왜 전화 안 받아?ㅜ');setTimeout(incomingCall,5000);},5000);}else if(!answered){banner('부재중 전화',true);}}
setTimeout(()=>{smsAdd('자기야 ㅎㅎ');setTimeout(()=>{smsAdd('내 폰 들구간거 알아? 지금 어디야?');setTimeout(incomingCall,5000);},5000);},90000);
</script>

function playMemo(i){const [title,src]=voiceTracks[i];document.getElementById('voice-player').style.display='block';document.getElementById('voice-title').textContent=title;const a=document.getElementById('memo-audio');a.pause();a.src=src;a.play().catch(()=>{});}
let toneCtx=null,ringInterval=null;
function ensureTone(){try{if(!toneCtx)toneCtx=new (window.AudioContext||window.webkitAudioContext)();if(toneCtx.state==='suspended')toneCtx.resume().catch(()=>{});return toneCtx}catch{return null}}
function tone(freq=850,duration=.13,offset=0){const ctx=ensureTone();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,ctx.currentTime+offset);gain.gain.exponentialRampToValueAtTime(.10,ctx.currentTime+offset+.018);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+offset+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+offset);osc.stop(ctx.currentTime+offset+duration+.02)}
function playAlertTone(){tone(920,.15,0);tone(1180,.20,.17)}
function startRingtone(){stopRingtone();const ring=()=>{tone(660,.22,0);tone(830,.22,.25);tone(990,.3,.52)};ring();ringInterval=setInterval(ring,1800)}
function stopRingtone(){if(ringInterval!==null){clearInterval(ringInterval);ringInterval=null}}

document.addEventListener('pointerdown',()=>ensureTone(),{once:true});
</script>
